spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/everlake}
    username: ${DB_USERNAME:everlake}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:super-secret-key-change-me-1234567890}

